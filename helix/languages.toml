# Generated by scripts/sync.py. Merge into your Helix languages.toml.
[language-server.dyn]
command = "dyn"
args = ["lsp"]

[[language]]
name = "dyn"
scope = "source.dyn"
file-types = ["dyn"]
roots = ["dyn.project", ".git", ".jj"]
comment-tokens = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "    " }
language-servers = ["dyn"]

[language.debugger]
name = "lldb-dap"
transport = "stdio"
command = "lldb-dap"

[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [{ name = "binary", completion = "filename" }]
args = { program = "{0}", stopOnEntry = false }

[[grammar]]
name = "dyn"
source = { git = "https://github.com/17robots/tree-sitter-dyn.git", rev = "4cb844df79b660f35f980e2f0f1dbbf5d3ab428b" }
