name: Prepare SDK update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Dyn version (for example 0.1.0-preview.5)
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release and generate pins
        env:
          DYN_VERSION: ${{ inputs.version }}
        run: |
          python scripts/update-release.py "$DYN_VERSION"
          python scripts/sync.py --check
          git diff --binary > dyn-sdk-update.patch
      - uses: actions/upload-artifact@v4
        with:
          name: dyn-sdk-update
          path: dyn-sdk-update.patch
